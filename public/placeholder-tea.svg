<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3faf5" />
      <stop offset="50%" stop-color="#e7f3ec" />
      <stop offset="100%" stop-color="#d6ebd9" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fb8b2" />
      <stop offset="100%" stop-color="#2f6a4a" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2eee6" stop-opacity="0.85" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#173a40" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" rx="24" />

  <!-- Botanical Rings -->
  <circle cx="300" cy="300" r="190" fill="none" stroke="#2f6a4a" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="300" cy="300" r="160" fill="none" stroke="#4fb8b2" stroke-opacity="0.16" stroke-width="1" />

  <!-- Steam Whisps -->
  <g stroke="#328f97" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M275 230 C265 200, 285 175, 270 145" />
    <path d="M305 220 C320 190, 295 165, 315 135" />
    <path d="M335 230 C345 205, 330 180, 345 155" />
  </g>

  <!-- Teacup & Saucer Group -->
  <g filter="url(#softGlow)">
    <!-- Saucer -->
    <ellipse cx="300" cy="390" rx="130" ry="24" fill="url(#cupGrad)" stroke="#173a40" stroke-opacity="0.12" stroke-width="1.5" />
    <ellipse cx="300" cy="390" rx="85" ry="12" fill="none" stroke="#2f6a4a" stroke-opacity="0.18" stroke-width="1" />

    <!-- Cup Body -->
    <path d="M220 280 C220 370, 380 370, 380 280 Z" fill="url(#cupGrad)" stroke="#173a40" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Cup Rim -->
    <ellipse cx="300" cy="280" rx="80" ry="18" fill="#ffffff" stroke="#173a40" stroke-opacity="0.15" stroke-width="1.5" />
    <!-- Tea Liquid Surface -->
    <ellipse cx="300" cy="283" rx="72" ry="14" fill="#a45832" fill-opacity="0.82" />
    
    <!-- Cup Handle -->
    <path d="M375 295 C410 295, 410 345, 370 345" fill="none" stroke="#173a40" stroke-opacity="0.2" stroke-width="10" stroke-linecap="round" />
    <path d="M375 295 C406 295, 406 345, 370 345" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Botanical Tea Leaves Motif -->
  <g transform="translate(300, 275) rotate(-15)">
    <path d="M0,0 Q18,-35 40,-25 Q35,-5 0,0" fill="url(#leafGrad)" />
    <path d="M0,0 Q-18,-30 -35,-18 Q-28,-2 0,0" fill="url(#leafGrad)" opacity="0.85" />
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="0" y1="0" x2="-25" y2="-14" stroke="#ffffff" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Typography / Brandmark in Placeholder -->
  <text x="300" y="470" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="600" fill="#173a40" letter-spacing="3" opacity="0.85">TEAMEM</text>
  <text x="300" y="495" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2f6a4a" letter-spacing="4" text-transform="uppercase" opacity="0.65">Artisanal Tea Blend</text>
</svg>
